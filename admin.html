<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>Photo Manager — Zoom Digital Photo Studio</title>
<style>
  :root{
    --ink:#141312; --paper:#F3F1ED; --crimson:#A21C2E; --line:rgba(20,19,18,.14);
    --muted:#6E6A64;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--paper); color:var(--ink);
  }
  header{
    background:var(--ink); color:#fff; padding:22px 20px; text-align:center;
  }
  header h1{ margin:0; font-size:1.2rem; font-weight:600; }
  header p{ margin:6px 0 0; font-size:.85rem; color:rgba(255,255,255,.65); }

  #lockScreen{
    max-width:360px; margin:60px auto; padding:0 20px; text-align:center;
  }
  #lockScreen input{
    width:100%; padding:14px; font-size:1rem; border:1px solid var(--line);
    border-radius:4px; margin-bottom:12px;
  }
  #lockScreen button, .upload-btn, .save-btn{
    width:100%; padding:14px; font-size:1rem; font-weight:600;
    background:var(--crimson); color:#fff; border:none; border-radius:4px;
    cursor:pointer;
  }
  #lockScreen .error{ color:var(--crimson); font-size:.85rem; margin-top:8px; min-height:1.2em; }

  #app{ display:none; max-width:900px; margin:0 auto; padding:20px; }
  .category{
    background:#fff; border:1px solid var(--line); border-radius:6px;
    margin-bottom:18px; overflow:hidden;
  }
  .category-head{
    padding:14px 16px; display:flex; align-items:center; justify-content:space-between;
    border-bottom:1px solid var(--line);
  }
  .category-head h2{ margin:0; font-size:1rem; }
  .category-head label{
    font-size:.85rem; color:#fff; background:var(--crimson); padding:8px 14px;
    border-radius:4px; cursor:pointer;
  }
  .category-head input[type=file]{ display:none; }
  .photo-grid{
    display:grid; grid-template-columns:repeat(auto-fill,minmax(110px,1fr));
    gap:10px; padding:14px 16px;
  }
  .photo-tile{ position:relative; aspect-ratio:1; border-radius:4px; overflow:hidden; background:#eee; }
  .photo-tile img{ width:100%; height:100%; object-fit:cover; display:block; }
  .photo-tile button{
    position:absolute; top:4px; right:4px; width:24px; height:24px; border-radius:50%;
    border:none; background:rgba(20,19,18,.75); color:#fff; font-size:1rem; line-height:1;
    cursor:pointer;
  }
  .empty-msg{ padding:14px 16px; color:var(--muted); font-size:.85rem; }
  .status{ text-align:center; padding:14px; font-size:.85rem; color:var(--muted); }
</style>
</head>
<body>

<header>
  <h1>Zoom Digital Photo Studio — Photo Manager</h1>
  <p>Upload or remove photos. Changes appear on the live site right away.</p>
</header>

<div id="lockScreen">
  <p>Enter the password to manage photos.</p>
  <input type="password" id="passwordInput" placeholder="Password" autocomplete="current-password">
  <button id="unlockBtn">Unlock</button>
  <div class="error" id="lockError"></div>
</div>

<div id="app"></div>
<div class="status" id="statusMsg"></div>

<script>
(function () {
  "use strict";

  var CATEGORIES = [
    { slug: "wedding-photography", title: "Wedding Photography" },
    { slug: "event-photography", title: "Event Photography" },
    { slug: "corporate-events", title: "Corporate Events" },
    { slug: "outdoor-photoshoot", title: "Outdoor Photoshoot" },
    { slug: "professional-photoshoot", title: "Professional Photoshoot" },
    { slug: "photo-framing-collage", title: "Photo Framing & Collage Frame" },
    { slug: "passport-visa-photo", title: "Passport & Visa Photo" },
    { slug: "enlargement", title: "Enlargement" },
    { slug: "led-photo-frame", title: "LED Photo Frame" },
    { slug: "acrylic-frame", title: "Acrylic Frame" }
  ];

  var password = sessionStorage.getItem("adminPassword") || "";
  var lockScreen = document.getElementById("lockScreen");
  var app = document.getElementById("app");
  var statusMsg = document.getElementById("statusMsg");

  function setStatus(text) {
    statusMsg.textContent = text || "";
  }

  function unlock() {
    lockScreen.style.display = "none";
    app.style.display = "block";
    loadPhotos();
  }

  document.getElementById("unlockBtn").addEventListener("click", function () {
    var entered = document.getElementById("passwordInput").value;
    if (!entered) return;
    password = entered;
    sessionStorage.setItem("adminPassword", password);
    unlock();
  });

  if (password) unlock();

  function loadPhotos() {
    setStatus("Loading photos...");
    fetch("/api/photos")
      .then(function (r) { return r.json(); })
      .then(function (bySlug) {
        render(bySlug);
        setStatus("");
      })
      .catch(function () { setStatus("Couldn't load photos. Try refreshing."); });
  }

  function render(bySlug) {
    app.innerHTML = "";
    CATEGORIES.forEach(function (cat) {
      var photos = bySlug[cat.slug] || [];

      var section = document.createElement("div");
      section.className = "category";

      var head = document.createElement("div");
      head.className = "category-head";
      head.innerHTML =
        "<h2>" + cat.title + "</h2>" +
        "<label>+ Add photo<input type='file' accept='image/*'></label>";
      section.appendChild(head);

      var fileInput = head.querySelector("input[type=file]");
      fileInput.addEventListener("change", function () {
        if (fileInput.files[0]) uploadPhoto(cat.slug, fileInput.files[0]);
      });

      if (photos.length) {
        var grid = document.createElement("div");
        grid.className = "photo-grid";
        photos.forEach(function (photo) {
          var tile = document.createElement("div");
          tile.className = "photo-tile";
          tile.innerHTML =
            "<img src='" + photo.url + "' alt=''>" +
            "<button title='Delete'>&times;</button>";
          tile.querySelector("button").addEventListener("click", function () {
            deletePhoto(photo.url);
          });
          grid.appendChild(tile);
        });
        section.appendChild(grid);
      } else {
        var empty = document.createElement("div");
        empty.className = "empty-msg";
        empty.textContent = "No photos yet.";
        section.appendChild(empty);
      }

      app.appendChild(section);
    });
  }

  function uploadPhoto(slug, file) {
    setStatus("Uploading...");
    fetch("/api/photos?slug=" + encodeURIComponent(slug) + "&filename=" + encodeURIComponent(file.name), {
      method: "POST",
      headers: {
        "x-admin-password": password,
        "Content-Type": file.type || "application/octet-stream"
      },
      body: file
    })
      .then(function (r) {
        if (r.status === 401) throw new Error("Wrong password");
        if (!r.ok) throw new Error("Upload failed");
        return r.json();
      })
      .then(function () { loadPhotos(); })
      .catch(function (err) {
        setStatus(err.message);
        if (err.message === "Wrong password") {
          sessionStorage.removeItem("adminPassword");
          location.reload();
        }
      });
  }

  function deletePhoto(url) {
    if (!confirm("Remove this photo?")) return;
    setStatus("Removing...");
    fetch("/api/photos?url=" + encodeURIComponent(url), {
      method: "DELETE",
      headers: { "x-admin-password": password }
    })
      .then(function (r) {
        if (r.status === 401) throw new Error("Wrong password");
        if (!r.ok) throw new Error("Delete failed");
        return r.json();
      })
      .then(function () { loadPhotos(); })
      .catch(function (err) { setStatus(err.message); });
  }
})();
</script>
</body>
</html>
