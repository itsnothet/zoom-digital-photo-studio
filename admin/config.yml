backend:
  name: git-gateway
  branch: main

# Photos uploaded through the admin page are committed straight into the
# repo here — no external storage service, no server of ours involved.
media_folder: "assets/images/uploads"
public_folder: "assets/images/uploads"

publish_mode: simple

collections:
  - name: "site"
    label: "Site Photos"
    files:
      - name: "site-images"
        label: "Logo, Hero, About &amp; Service Photos"
        description: "Every non-catalogue photo on the site — logo, homepage hero, about photo, and the 8 service icons. Click any existing photo to replace it, or leave a field empty to keep the placeholder. Changes go live automatically after saving."
        file: "data/site-images.json"
        fields:
          - { label: "Logo (header + footer)", name: "logo", widget: "image", required: false, hint: "Replaces the circular mark and studio name in the header and footer. Leave empty to keep the default mark." }
          - { label: "Hero — Main Photo", name: "heroMain", widget: "image", required: false, hint: "Large photo on the right side of the homepage banner." }
          - { label: "Hero — Side Photo", name: "heroSide", widget: "image", required: false, hint: "Small overlapping photo on the left of the homepage banner." }
          - { label: "About — Studio Photo", name: "about", widget: "image", required: false }
          - { label: "Service — Passport Photos", name: "servicePassport", widget: "image", required: false }
          - { label: "Service — Visa Photos", name: "serviceVisa", widget: "image", required: false }
          - { label: "Service — Wedding Photography", name: "serviceWedding", widget: "image", required: false }
          - { label: "Service — Photo Frames", name: "serviceFrames", widget: "image", required: false }
          - { label: "Service — Event Videography", name: "serviceVideography", widget: "image", required: false }
          - { label: "Service — Event Albums", name: "serviceAlbums", widget: "image", required: false }
          - { label: "Service — Professional Photoshoot", name: "servicePortraits", widget: "image", required: false }
          - { label: "Service — Product Photography", name: "serviceProduct", widget: "image", required: false }

  - name: "catalogue"
    label: "Catalogue Photos"
    files:
      - name: "catalogue-images"
        label: "Category Photos"
        description: "Drag photos into the category they belong to, or click an existing photo to replace it. Changes go live on the site automatically after saving."
        file: "data/catalogue-images.json"
        fields:
          - label: "Wedding Photography"
            name: "wedding-photography"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Event Photography"
            name: "event-photography"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Corporate Events"
            name: "corporate-events"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Outdoor Photoshoot"
            name: "outdoor-photoshoot"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Professional Photoshoot"
            name: "professional-photoshoot"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Photo Framing & Collage Frame"
            name: "photo-framing-collage"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Passport & Visa Photo"
            name: "passport-visa-photo"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Enlargement"
            name: "enlargement"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "LED Photo Frame"
            name: "led-photo-frame"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
          - label: "Acrylic Frame"
            name: "acrylic-frame"
            widget: "list"
            field: { label: "Photo", name: "src", widget: "image" }
